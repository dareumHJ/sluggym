name: Poll Gym Occupancy

on:
  schedule:
    - cron: '7,37 * * * *'  # every 30 minutes at 7 and 37 past the hour
  workflow_dispatch: # can run manually from GitHub Actions tab

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx supabase

      - name: Poll and persist occupancy
        env:
          SLUGRUSH_API_KEY: ${{ secrets.SLUGRUSH_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/poll_occupancy.py